# Country-of-origin groupings for generated persona records.
#
# Statistics Denmark publishes no continent aggregate for FOLK1C's IELAND dimension, so
# this file is the project's own grouping. It follows the continent blocks in the table
# metadata, which already separate the Middle East from the rest of Asia, with two
# documented departures:
#
#   - Tyrkiet is grouped with the Middle East rather than with Europe.
#   - Algeriet, Egypten, Libyen, Marokko and Tunesien are grouped with the Middle East
#     rather than with sub-Saharan Africa.
#
# `western` marks the groups that make up Statistics Denmark's own western population;
# summing them reproduces FOLK1E's western total to within 0.2 percent, which is the
# check that keeps this grouping honest. Keys are StatBank IELAND codes, with the Danish
# name in a comment. Generated records carry the group, never the country.
version: 1

western:
  - vesteuropa_og_eu
  - nordamerika_og_oceanien

