version: 2
language: en
release_rows: 100000
minimum_source_count: 50
minimum_expected_release_count: 5
classifications:
  # Statistics Denmark publishes classifications as attachments on dst.dk rather
  # than through the StatBank data API, so they use a separate source adapter.
  - classification_id: NUTS_V1_2007_DK
    role: geography_hierarchy
    title: Regioner, landsdele og kommuner
    valid_from: "2007-01-01"
    page_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/nuts
    attachment_url: https://www.dst.dk/klassifikationsbilag/5d18d1e0-400b-4505-92ad-6782915980a3csv_da
sources:
  - table_id: FOLK2
    role: origin_country_marginal
    period: "2025"
    # BULK is StatBank's streaming format and is exempt from the one-million-cell
    # limit applied to non-streaming formats.
    format: BULK
    # Reviewed all-zero IELAND partitions omitted by the archived BULK response.
    expected_zero_codes:
      - "5111"
      - "5176"
      - "5184"
      - "5248"
      - "5253"
      - "5256"
      - "5264"
      - "5286"
      - "5301"
      - "5307"
      - "5325"
      - "5336"
      - "5346"
      - "5353"
      - "5394"
      - "5397"
      - "5428"
      - "5473"
      - "5480"
      - "5493"
      - "5494"
      - "5498"
      - "5506"
      - "5516"
      - "5527"
      - "5528"
      - "5529"
      - "5530"
      - "5531"
      - "5533"
      - "5535"
    dimensions:
      ALDER:
        selector: adult_exact_ages
      KØN:
        values: [M, K]
      HERKOMST:
        selector: all
      STATSB:
        selector: all
      IELAND:
        selector: all
      Tid:
        values: ["2025"]
  - table_id: FOLK1A
    role: demographic_base
    period: 2025K1
    dimensions:
      OMRÅDE:
        selector: municipalities
      KØN:
        values: ["1", "2"]
      ALDER:
        selector: age_16_plus
      CIVILSTAND:
        values: [U, G, E, F]
      Tid:
        values: [2025K1]
  - table_id: RAS209
    role: education_status_joint
    period: "2024"
    # The municipality-level joint is retained through preparation; BULK avoids
    # materialising the approximately 5.3 million-cell response in the API's
    # non-streaming format.
    format: BULK
    dimensions:
      OMRÅDE:
        selector: municipalities
      UDDANNELSE:
        selector: non_total
      SOCIO:
        selector: non_total
      ALDER:
        values:
          - 16-19
          - 20-24
          - 25-29
          - 30-34
          - 35-39
          - 40-44
          - 45-49
          - 50-54
          - 55-59
          - 60-64
          - 65-66
          - 67-
      KØN:
        values: [M, K]
      Tid:
        values: ["2024"]
  - table_id: RAS202
    role: detailed_status_refinement
    period: "2024"
    dimensions:
      SOCIO:
        selector: non_total
      ALDER:
        selector: adult_ras_ages
      KOEN:
        values: [M, K]
      Tid:
        values: ["2024"]
  - table_id: BEFOLK3
    role: population_holdout
    period: "2025"
    dimensions:
      OMRÅDE:
        selector: municipalities
      KØN:
        values: ["1", "2"]
      ALDER:
        selector: adult_exact_ages
      Tid:
        values: ["2025"]
  - table_id: RAS210
    role: municipality_status_holdout
    period: "2024"
    dimensions:
      BOPKOM:
        selector: municipalities
      SOCIO:
        selector: all
      ALERAMS:
        selector: adult_ras_ages
      KON:
        values: [M, K]
      Tid:
        values: ["2024"]
