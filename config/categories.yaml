# Official DST labels for the RAS209 UDDANNELSE codes, taken verbatim from
# the table's own StatBank metadata in Danish and English. H10-H90 are a
# StatBank presentation grouping of HFUDD, not a published DST nomenclature:
# DISCED-15 does not contain these codes and DST publishes no crosswalk for
# them. local_isced_assertion is therefore this repository's editorial
# judgement, not an official mapping, and must be cited as such.
