[project]
name = "danish_personas"
version = "0.0.0"
description = "Generation of a dataset consisting of Danish personas."
readme = "README.md"
authors = [
  {name = "Dan Saattrup Smart", email = "dan@syv.ai"},
]
maintainers = [
  {name = "Dan Saattrup Smart", email = "dan@syv.ai"},
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "click>=8.2.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "hydra-core>=1.3.7",
    "lingua-language-detector>=2.2.0",
    "numpy>=2.3.0",
    "plotly>=7.1.0",
    "polars>=1.33.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "scipy>=1.16.0",
    "tldextract>=5.3.2",
    "tqdm>=4.70.1",
]

[project.urls]
Repository = "https://github.com/syv-ai/danish_personas"
Issues = "https://github.com/syv-ai/danish_personas/issues"

[project.license]
file = "LICENSE"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pre-commit>=4.3.0",
  "readme-coverage-badger>=1.0.1",
  "ruff>=0.15.1",
  "ty>=0.0.29",
  "nbstripout>=0.9.0",
  "coverage>=7.10.5",
  "pip>=25.3.0",
  "vulture>=2.16",
  "slopo>=0.4.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
extend-include = [
  "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
  # Imports
  "I",
  "PLC0415",
  # Docstrings
  "D",
  "DOC",
  # pycodestyle errors and warnings (PEP8)
  "E",
  "W",
  # flake-annotations (type hints)
  "ANN",
  # Pyflakes
  "F",
  # Enforce simple structure
  "C901",
  "PLR0912",
]
ignore = [
  # Type annotations for "self" arguments
  "ANN101",
  # Type annotations for "cls" arguments
  "ANN102",
  # Type annotations for *args
  "ANN002",
  # Type annotations for **kwargs
  "ANN003",
  # Always add blank line before class docstring
  "D203",
  # No new-line as first line of docstring
  "D213",
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
  "F401",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.4.1"
addopts = [
  '--durations=10',
  '--color=yes',
  '--doctest-modules',
  '--cov=src/danish_personas',
]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::ImportWarning",
  "ignore::ResourceWarning",
  "ignore::FutureWarning",
]
log_cli_level = "info"
testpaths = [
  "tests",
  "src/danish_personas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
